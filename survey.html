<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Survey | SCALE Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0e1c2f;--navy:#1a3a5c;--blue:#1e5fa8;
  --teal:#0d8a7a;--gold:#c8922a;--cream:#f5f0e8;
  --off:#faf8f5;--muted:#6b7c8d;--light:#e8eff7;
  --border:#d0dce8;--white:#ffffff;--err:#c0392b;
  --green:#1e8449;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--ink);min-height:100vh}

/* ── HEADER ── */
.survey-header{
  position:sticky;top:0;z-index:100;
  background:rgba(14,28,47,0.96);backdrop-filter:blur(12px);
  padding:0.6rem 2.5rem 0.75rem;
}
.header-brand{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;color:#fff;white-space:nowrap;
}
.header-brand span{color:var(--gold)}

/* ── TOP ROW: brand + step label ── */
.header-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:0.35rem;
}
.header-step-label{
  font-size:0.72rem;font-weight:500;color:var(--teal);
  letter-spacing:0.04em;
}
.header-step-name{
  color:rgba(255,255,255,0.6);font-weight:400;
}

/* ── SEGMENTED PROGRESS BAR ── */
.progress-track-wrap{position:relative;margin-bottom:0.5rem}

/* Percentage bubble */
.progress-pct-bubble{
  position:absolute;top:-1.2rem;
  transform:translateX(-50%);
  background:var(--teal);color:#fff;
  font-size:0.68rem;font-weight:600;
  padding:0.2rem 0.55rem;border-radius:2rem;
  white-space:nowrap;pointer-events:none;
  transition:left 0.4s ease;
  display:flex;align-items:center;gap:0.3rem;
}
.progress-pct-bubble::after{
  content:'';position:absolute;bottom:-4px;left:50%;
  transform:translateX(-50%);
  border:4px solid transparent;border-top-color:var(--teal);
  border-bottom:none;
}

/* Segmented bar: 15 pill segments */
.seg-bar{
  display:flex;gap:3px;align-items:center;height:10px;
}
.seg{
  flex:1;height:10px;border-radius:5px;
  background:rgba(255,255,255,0.15);
  transition:background 0.3s ease;
}
.seg.done{background:var(--teal)}
.seg.active{background:var(--teal);opacity:0.7}

/* Milestone labels */
.progress-milestones{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-top:0.35rem;
}
.milestone{
  display:flex;flex-direction:column;align-items:center;
  gap:0.1rem;
}
.milestone-num{
  font-family:'Cormorant Garamond',serif;
  font-size:0.85rem;font-weight:600;color:#fff;line-height:1;
}
.milestone-lbl{
  font-size:0.6rem;text-transform:uppercase;letter-spacing:0.07em;
  color:rgba(255,255,255,0.4);
}
.milestone.right{align-items:flex-end}
.milestone.center{align-items:center}

/* ── LAYOUT ── */
.survey-body{width:100%;padding:1.5rem 2.5rem 5rem}

/* ── SECTION CARD ── */
.section-card{
  background:#fff;border:1px solid var(--border);
  border-radius:1rem;padding:2rem 3.5rem;
  margin-bottom:1.5rem;
  animation:fadeUp 0.4s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.section-tag{
  font-size:0.68rem;font-weight:500;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--teal);margin-bottom:0.6rem;display:block
}
.section-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.8rem;font-weight:300;color:var(--ink);margin-bottom:0.3rem
}
.section-subtitle{font-size:0.88rem;color:var(--muted);line-height:1.6;margin-bottom:1.8rem}

/* ── FORM FIELDS ── */
.field{margin-bottom:1.4rem}
label.field-label{
  display:block;font-size:0.82rem;font-weight:500;
  color:var(--navy);margin-bottom:0.45rem
}
label.field-label .req{color:var(--err);margin-left:2px}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:0.75rem 1rem;
  border:1.5px solid var(--border);border-radius:0.5rem;
  font-family:'DM Sans',sans-serif;font-size:0.92rem;color:var(--ink);
  background:#fff;outline:none;transition:border-color 0.2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
input.err,select.err,textarea.err{border-color:var(--err)}
.field-error{font-size:0.75rem;color:var(--err);margin-top:0.3rem;display:none}
.field-error.show{display:block}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
@media(max-width:600px){.two-col,.three-col{grid-template-columns:1fr}}

/* ── LIKERT ── */
.likert-wrap{display:flex;gap:0.5rem;flex-wrap:wrap}
.likert-opt{flex:1;min-width:3rem}
.likert-opt input{display:none}
.likert-opt label{
  display:flex;flex-direction:column;align-items:center;gap:0.3rem;
  padding:0.6rem 0.4rem;border:1.5px solid var(--border);
  border-radius:0.5rem;cursor:pointer;font-size:0.75rem;
  color:var(--muted);text-align:center;line-height:1.3;
  transition:all 0.15s;
}
.likert-opt input:checked + label{
  border-color:var(--teal);background:rgba(13,138,122,0.07);
  color:var(--teal);font-weight:500
}
.likert-opt label:hover{border-color:var(--navy);color:var(--navy)}
.likert-num{font-size:1.1rem;font-weight:600;color:inherit}

/* ── RADIO PILLS ── */
.radio-group{display:flex;flex-direction:column;gap:0.5rem}
.radio-opt input{display:none}
.radio-opt label{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.7rem 1rem;border:1.5px solid var(--border);
  border-radius:0.45rem;cursor:pointer;font-size:0.88rem;color:var(--muted);
  transition:all 0.15s
}
.radio-opt input:checked + label{
  border-color:var(--teal);background:rgba(13,138,122,0.06);
  color:var(--ink);font-weight:500
}
.radio-dot{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;transition:all 0.15s
}
.radio-opt input:checked + label .radio-dot{
  border-color:var(--teal);background:var(--teal)
}

/* ── CHECKBOX PILLS ── */
.check-group{display:flex;flex-direction:column;gap:0.45rem}
.check-opt input{display:none}
.check-opt label{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.6rem 1rem;border:1.5px solid var(--border);
  border-radius:0.45rem;cursor:pointer;font-size:0.85rem;color:var(--muted);
  transition:all 0.15s
}
.check-opt input:checked + label{
  border-color:var(--blue);background:rgba(30,95,168,0.05);
  color:var(--ink);font-weight:500
}
.check-box{
  width:14px;height:14px;border-radius:3px;border:2px solid var(--border);
  flex-shrink:0;transition:all 0.15s;display:flex;align-items:center;justify-content:center
}
.check-opt input:checked + label .check-box{
  border-color:var(--blue);background:var(--blue)
}
.check-opt input:checked + label .check-box::after{
  content:'✓';color:#fff;font-size:9px;font-weight:700
}

/* ── SLIDER ── */
.slider-wrap{padding:0.5rem 0}
.slider-labels{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-bottom:0.4rem}
input[type=range]{
  width:100%;-webkit-appearance:none;height:6px;
  background:linear-gradient(to right,var(--teal) 0%,var(--teal) var(--pct,50%),var(--border) var(--pct,50%),var(--border) 100%);
  border-radius:3px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:2px solid var(--teal);box-shadow:0 2px 6px rgba(0,0,0,0.15);cursor:pointer
}
.slider-value{
  text-align:center;margin-top:0.5rem;
  font-family:'Cormorant Garamond',serif;
  font-size:1.8rem;font-weight:600;color:var(--teal)
}

/* ── PRODUCT IMAGE CARDS ── */
.product-block{
  background:var(--off);border:1px solid var(--border);
  border-radius:1rem;padding:2rem;margin-bottom:2rem
}
.product-block-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.5rem
}
.product-block-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.4rem;font-weight:600;color:var(--navy)
}
.product-block-count{
  font-size:0.72rem;color:var(--muted);letter-spacing:0.06em;
  text-transform:uppercase
}
.product-block-note{font-size:0.82rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.5}

.image-choice-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-bottom:1.5rem;
  align-items:stretch;
}
@media(max-width:600px){.image-choice-grid{grid-template-columns:1fr}}

.img-card{
  border:2.5px solid var(--border);border-radius:0.75rem;
  overflow:hidden;cursor:pointer;
  transition:border-color 0.2s,box-shadow 0.2s,transform 0.15s;
  background:#f0f0f0;
  display:flex;flex-direction:column;
  /* height determined by 1:1 grid + footer */
}
.img-card:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.img-card.selected{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,138,122,0.15)}
.img-card.ranked-1{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,146,42,0.15)}
.img-card.ranked-2{border-color:var(--blue);box-shadow:0 0 0 2px rgba(30,95,168,0.1)}
.img-card.ranked-3{border-color:var(--muted);box-shadow:0 0 0 2px rgba(107,124,141,0.1)}

.img-placeholder{
  width:100%;
  position:relative;overflow:hidden;
  background:#f0f0f0;
}
.img-placeholder-label{
  font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);margin-top:0.5rem
}
.img-card-footer{
  padding:0.7rem 1rem;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between
}
.img-card-letter{
  font-family:'Cormorant Garamond',serif;
  font-size:1.2rem;font-weight:600;color:var(--navy)
}
.img-card-rank{
  font-size:0.7rem;font-weight:500;color:var(--muted);
  background:var(--light);padding:0.2rem 0.5rem;border-radius:0.25rem
}
.img-card.selected .img-card-rank{background:rgba(13,138,122,0.1);color:var(--teal)}

/* ── RANK INSTRUCTION ── */
.rank-instruction{
  font-size:0.8rem;color:var(--muted);margin-bottom:0.8rem;
  padding:0.6rem 1rem;background:var(--light);border-radius:0.45rem;
  display:flex;align-items:center;gap:0.5rem
}

/* ── QUESTION BLOCK ── */
.q-block{margin-bottom:1.6rem}
.q-label{
  font-size:0.88rem;font-weight:500;color:var(--ink);
  margin-bottom:0.7rem;line-height:1.5
}
.q-label .qnum{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;color:var(--teal);margin-right:0.4rem;font-weight:600
}

/* ── BRANCHING ── */
.branch-reveal{display:none;margin-top:0.8rem;padding:1rem;background:var(--light);border-radius:0.5rem}
.branch-reveal.show{display:block}

/* ── NAV BUTTONS ── */
.nav-buttons{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:2rem;gap:1rem;flex-wrap:wrap
}
.btn-back{
  padding:0.8rem 1.8rem;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);
  border-radius:0.5rem;font-family:'DM Sans',sans-serif;
  font-size:0.88rem;cursor:pointer;transition:all 0.2s
}
.btn-back:hover{border-color:var(--navy);color:var(--navy)}
.btn-next{
  padding:0.8rem 2rem;background:var(--navy);color:#fff;
  border:none;border-radius:0.5rem;font-family:'DM Sans',sans-serif;
  font-size:0.88rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:0.6rem;
  transition:background 0.2s,transform 0.15s
}
.btn-next:hover{background:var(--blue);transform:translateY(-1px)}
.btn-submit{background:var(--teal)}
.btn-submit:hover{background:#0a7a6c}

/* ── TRAIT SCALE ── */
.trait-row{
  display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start;
  padding:1rem 0;border-bottom:1px solid var(--border)
}
.trait-row:last-child{border-bottom:none}
.trait-statement{font-size:0.88rem;color:var(--ink);line-height:1.5}
.trait-scale{display:flex;gap:0.3rem}
.trait-btn{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
  background:transparent;cursor:pointer;font-size:0.75rem;color:var(--muted);
  transition:all 0.15s;display:flex;align-items:center;justify-content:center
}
.trait-btn:hover{border-color:var(--navy);color:var(--navy)}
.trait-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}

/* ── SAVED NOTICE ── */
.saved-notice{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--ink);color:#fff;padding:0.6rem 1.2rem;
  border-radius:2rem;font-size:0.78rem;
  opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:200
}
.saved-notice.show{opacity:1}

/* ── SECTION DIVIDER ── */
.section-divider{
  display:flex;align-items:center;gap:1rem;margin:2.5rem 0 1.5rem;
  font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)
}
.section-divider::before,.section-divider::after{
  content:'';flex:1;height:1px;background:var(--border)
}

/* ── CHAR COUNT ── */
.char-count{font-size:0.72rem;color:var(--muted);text-align:right;margin-top:0.3rem}

/* ── HIDDEN ── */
.hidden{display:none!important}

/* ── 5-ITEM DISPLAY GRID ── */
.five-item-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:0.8rem;
  margin-bottom:0.5rem;
}
@media(max-width:640px){.five-item-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.five-item-grid{grid-template-columns:repeat(2,1fr)}}
.item-display-card{
  border:1.5px solid var(--border);border-radius:0.6rem;
  background:#fff;text-align:center;padding:1rem 0.5rem;
}
.item-img-wrap{
  height:140px;display:flex;align-items:center;justify-content:center;
}
.item-label{
  font-size:0.78rem;font-weight:500;color:var(--navy);margin-top:0.5rem;
}

/* ── RATING GRID TABLE ── */
.rating-grid-wrap{overflow-x:auto;margin-bottom:0.5rem;width:100%}
.rating-grid{
  width:100%;border-collapse:collapse;min-width:360px;
}
.rating-grid th,.rating-grid td{
  padding:0.55rem 0.5rem;text-align:center;
}
.rg-row-head{
  text-align:left!important;font-size:0.85rem;font-weight:500;
  color:var(--navy);padding-left:0.2rem!important;white-space:nowrap;
}
.rg-col-head{font-size:0.72rem;color:var(--muted)}
.rg-col-num{font-size:1rem;font-weight:600;color:var(--navy)}
.rg-col-lbl{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted)}
.rg-row{transition:background 0.15s}
.rg-row:nth-child(odd){background:var(--off)}
.rg-row.rg-rated{background:rgba(13,138,122,0.04)}
.rg-row.rg-missing{background:rgba(192,57,43,0.05)}
.rg-cell{padding:0.45rem!important}
.rg-radio-wrap{
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  width:36px;height:36px;margin:0 auto;border-radius:50%;
  transition:background 0.15s;
}
.rg-radio-wrap:hover{background:var(--light)}
.rg-radio-wrap input{display:none}
.rg-radio{
  width:20px;height:20px;border-radius:50%;
  border:2px solid var(--border);transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.rg-radio-wrap input:checked + .rg-radio{
  border-color:var(--teal);background:var(--teal);
}
.rg-radio-wrap input:checked + .rg-radio::after{
  content:'';width:7px;height:7px;border-radius:50%;background:#fff;display:block;
}

/* ── LIGHTBOX MODAL ── */
.lightbox-overlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0.88);
  align-items:center;justify-content:center;
  cursor:zoom-out;
  animation:lbFadeIn 0.2s ease;
}
.lightbox-overlay.open{display:flex}
@keyframes lbFadeIn{from{opacity:0}to{opacity:1}}
.lightbox-img-wrap{
  position:relative;max-width:85vw;max-height:85vh;
  display:flex;flex-direction:column;align-items:center;
  cursor:default;
}
.lightbox-img-wrap img{
  max-width:85vw;max-height:80vh;
  object-fit:contain;border-radius:0.5rem;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.lightbox-caption{
  color:rgba(255,255,255,0.7);font-size:0.85rem;
  margin-top:0.8rem;letter-spacing:0.06em;
}
.lightbox-close{
  position:absolute;top:-2.5rem;right:0;
  background:transparent;border:none;color:rgba(255,255,255,0.6);
  font-size:1.8rem;cursor:pointer;line-height:1;
  transition:color 0.2s;
}
.lightbox-close:hover{color:#fff}
/* Make all product images show zoom cursor */
.img-card img,.item-display-card img{cursor:zoom-in;width:100%;height:100%;object-fit:cover;display:block}

/* ── SECRET CODE MODAL ── */
.sc-overlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(14,28,47,0.85);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;
}
.sc-overlay.open{display:flex}
.sc-card{
  background:#fff;border-radius:1rem;padding:2.5rem 2rem;
  max-width:380px;width:90%;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,0.3);
  animation:scPop 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes scPop{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
@keyframes scShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sc-card.shake{animation:scShake 0.4s ease}
.sc-icon{font-size:2rem;margin-bottom:0.8rem}
.sc-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;font-weight:300;color:#0e1c2f;margin-bottom:0.3rem;
}
.sc-sub{font-size:0.82rem;color:#6b7c8d;margin-bottom:1.5rem;line-height:1.5}
.sc-input{
  width:100%;padding:0.75rem 1rem;text-align:center;
  font-family:'DM Sans',sans-serif;font-size:1.1rem;font-weight:500;
  letter-spacing:0.15em;border:2px solid #d0dce8;border-radius:0.5rem;
  outline:none;transition:border-color 0.2s;color:#0e1c2f;
}
.sc-input:focus{border-color:#0d8a7a}
.sc-input.err{border-color:#c0392b;background:rgba(192,57,43,0.04)}
.sc-err{font-size:0.75rem;color:#c0392b;margin-top:0.4rem;min-height:1rem}
.sc-btn{
  width:100%;margin-top:1rem;padding:0.85rem;
  background:#1a3a5c;color:#fff;border:none;border-radius:0.5rem;
  font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;
  cursor:pointer;transition:background 0.2s;
}
.sc-btn:hover{background:#1e5fa8}
.sc-cancel{
  display:block;margin-top:0.8rem;font-size:0.78rem;
  color:#6b7c8d;cursor:pointer;text-decoration:none;
  transition:color 0.2s;
}
.sc-cancel:hover{color:#0e1c2f}


/* ── VERTICAL RATING CARDS ── */
.vrate-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;
  margin-bottom:0.5rem;
}
@media(max-width:640px){.vrate-grid{grid-template-columns:repeat(2,1fr);gap:0.6rem}}
@media(max-width:380px){.vrate-grid{grid-template-columns:repeat(2,1fr)}}

.vrate-card{
  border:1.5px solid var(--border);border-radius:0.75rem;
  background:#fff;text-align:center;
  overflow:hidden;transition:border-color 0.2s,box-shadow 0.2s;
}

.vrate-lbl-bot{

function productIndexFromStep(step){
  return Math.floor((step - 1) / 2);

function isCategoryPage(step){ return step >= 1 && step <= 12 && (step % 2 === 1); }

if (!productOrders) {
  productOrders = {};
  PRODUCTS.forEach(p => {

    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    productOrders[p.id] = arr;
  });
  sessionStorage.setItem(ORDER_KEY, JSON.stringify(productOrders));
}

function updateHeader(){
  const total = SECTIONS.length; // 15
  const step  = current + 1;
  const pct   = Math.round((current / (total - 1)) * 100);

  // Update step label
  document.getElementById('stepNum').textContent   = step;
  document.getElementById('sectionLabel').textContent = SECTIONS[current];

  // Build segmented bar
  const bar = document.getElementById('segBar');
  if(bar){
    bar.innerHTML = '';
    for(let i = 0; i < total; i++){
      const seg = document.createElement('div');
      seg.className = 'seg' + (i < current ? ' done' : i === current ? ' active' : '');
      bar.appendChild(seg);
    }
  }

  // Move percentage bubble
  const bubble = document.getElementById('pctBubble');
  const pctText = document.getElementById('pctText');
  if(bubble && pctText){
    const leftPct = Math.max(4, Math.min(96, (current / (total - 1)) * 100));
    bubble.style.left = leftPct + '%';
    pctText.textContent = pct + '%';
  }
}

function saveDemographics(){
  let valid = true;
  const fields = [
    {id:'p2', errId:'p2err', check:v=>v},
    {id:'p3', errId:'p3err', check:v=>v},
    {id:'p4', errId:'p4err', check:v=>v},
    {id:'p5', errId:'p5err', check:v=>v},
    {id:'p6c',errId:'p6cerr',check:v=>v.trim()},
    {id:'p6n',errId:'p6nerr',check:v=>v},
    {id:'p7', errId:'p7err', check:v=>v},
  ];
  fields.forEach(f=>{
    const el=document.getElementById(f.id);
    const ok=f.check(el.value);
    el.classList.toggle('err',!ok);
    document.getElementById(f.errId).classList.toggle('show',!ok);
    if(!ok)valid=false;
  });
  const p8 = document.querySelector('input[name="p8"]:checked');
  document.getElementById('p8err').classList.toggle('show',!p8);
  if(!p8)valid=false;

  if(!valid){document.querySelector('.err')?.scrollIntoView({behavior:'smooth',block:'center'});return;}

  // Compute generation
  const dob = new Date(document.getElementById('p2').value);
  const year = dob.getFullYear();
  let gen = year<=1980?'Gen X':year<=1996?'Gen Y (Millennials)':year<=2012?'Gen Z':'Gen Alpha';

  responses.demographics = {
    name: document.getElementById('p1').value,
    dob: document.getElementById('p2').value,
    birth_year: year, generation: gen,
    gender: document.getElementById('p3').value,
    occupation: document.getElementById('p4').value,
    education: document.getElementById('p5').value,
    city: document.getElementById('p6c').value,
    country: document.getElementById('p6n').value,
    income: document.getElementById('p7').value,
    design_awareness: p8.value,
  };
  save(); current=1; render();
}

function selectCategory(pid, archLabel, letter, archIdx){
  if(!responses[pid]) responses[pid] = {};

  responses[pid].category_letter      = letter;
  responses[pid].category_arch_idx    = archIdx;

  ['A','B','C'].forEach(l => {

    const r = document.getElementById(`${pid}_cat_rank_${l}`);
    if(c){ c.classList.remove('selected'); }
    if(r){ r.textContent = ''; }
  });
  const card = document.getElementById(`${pid}_cat_${letter}`);
  const rank = document.getElementById(`${pid}_cat_rank_${letter}`);
  if(card) card.classList.add('selected');

function saveCategoryAndAdvance(pid){

  save();
  current++;

function saveRating(pid, letter, val){
  if(!responses[pid]) responses[pid]={};
  responses[pid]['rate_'+letter] = val;
  // Highlight the vrate card
  const card = document.getElementById(pid+'_vcard_'+letter);
  if(card){
    card.classList.add('rated');
    card.classList.remove('missing');
  }
}

function toggleInfluence(pid, val){
  if(!responses[pid]) responses[pid]={};
  let arr = responses[pid].influences || [];
  const idx = arr.indexOf(val);
  if(idx === -1) arr.push(val); else arr.splice(idx, 1);
  responses[pid].influences = arr;
}

function saveRatingPage(pid){
  const pr = responses[pid] || {};
  let valid = true;

  // Check all 5 ratings
  const letters = ['A','B','C','D'];
  const unrated = letters.filter(l => !pr[`rate_${l}`]);
  if(unrated.length > 0){
    document.getElementById(`${pid}_q1raterr`).classList.add('show');
    // Highlight unrated rows
    unrated.forEach(l => {
      const card = document.getElementById(pid+'_vcard_'+l);
      if(card){ card.classList.add('missing'); card.classList.remove('rated'); }
    });
    valid = false;
  } else {
    document.getElementById(`${pid}_q1raterr`).classList.remove('show');
  }

  // Read top choice directly from DOM — more reliable than responses cache
  const topRadio = document.querySelector(`input[name="${pid}_top"]:checked`);
  const topErrEl = document.getElementById(`${pid}_q2toperr`);
  if(!topRadio && !pr.top_choice){
    if(topErrEl) topErrEl.classList.add('show');
    valid = false;
  } else {
    if(topErrEl) topErrEl.classList.remove('show');
    // Ensure responses is updated from DOM in case saveField was missed
    if(topRadio && !pr.top_choice){
      responses[pid].top_choice = topRadio.value;
    }
  }

  if(!pr.influences || pr.influences.length === 0){
    document.getElementById(`${pid}_q3inferr`).classList.add('show');
    valid = false;
  }

  if(!valid){
    document.querySelector('.field-error.show')?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  save(); current++; render();
}

function saveClosing(field, val){
  if(!responses.closing) responses.closing={};
  responses.closing[field] = val;
}

function updateCharCount(el, countId){
  document.getElementById(countId).textContent = el.value.length+'/500';
}

function submitSurvey(){
  const cl = responses.closing || {};
  let valid = true;
  ['c1','c2','c3','c4'].forEach(f=>{
    const ok = !!cl[f];
    document.getElementById(`${f}err`).classList.toggle('show',!ok);
    if(!ok) valid=false;
  });
  if(!valid){ document.querySelector('.field-error.show')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }

  responses.closing.c5 = document.getElementById('c5input')?.value || '';
  responses.submitted_at = new Date().toISOString();

  // ── ALWAYS save locally FIRST — thank-you page reads from here ──────────
  localStorage.setItem('nn_survey_submitted', JSON.stringify(responses));
  localStorage.removeItem('nn_survey');

  // ── Submit to Google Apps Script ──────────────────────────────────────
  // IMPORTANT: Replace the URL below with your Apps Script /exec URL
  // Get it from: Apps Script editor → Deploy → Manage deployments → copy Web app URL
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGmWtNJcfCdciJPRKfjKVGpsiYX7w6SbK7T6-8LAyI5T2tVyZS_LqTZb9bCYWzUUVztg/exec';

  const submitAndRedirect = () => {
    window.location.href = 'thank-you.html';
  };

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR') || APPS_SCRIPT_URL.includes('YOUR_APPS')) {
    console.warn('Apps Script URL not configured. Response saved to localStorage only.');
    submitAndRedirect();
    return;
  }

  // Apps Script requires no-cors when called from a different origin (GitHub Pages)
  // This means we cannot read the response body, but the POST still reaches the script
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(responses),
  })
  .then(() => {
    console.log('Submitted to Apps Script successfully');
  })
  .catch(err => {
    console.warn('Apps Script POST failed (data saved locally):', err);
  })
  .finally(submitAndRedirect);
}

function goBack(){
  if(current > 0){ current--; render(); }
}


// ── LIGHTBOX ─────────────────────────────────────────────────────────
function openLightbox(src, caption) {
  const overlay = document.getElementById('lightboxOverlay');
  const img     = document.getElementById('lightboxImg');
  const cap     = document.getElementById('lightboxCaption');
  img.src       = src;
  img.alt       = caption || '';
  cap.textContent = caption || '';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightboxOverlay') &&
      !document.querySelector('.lightbox-close').contains(e.target)) return;
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

  </div>
</div>

<footer style="background:#0e1c2f;color:rgba(255,255,255,0.35);padding:1rem 3.5rem;display:flex;justify-content:space-between;align-items:center;font-size:0.72rem;flex-wrap:wrap;gap:0.5rem">
  <span>Design Research Study · SCALE Lab · IISc Bangalore</span>
  <a href="#" onclick="scOpen();return false;" style="opacity:0.45;cursor:pointer;transition:opacity 0.2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.45">Results</a>
</footer>
<!-- SECRET CODE MODAL -->
<div class="sc-overlay" id="scOverlay" onclick="scClose(event)">
  <div class="sc-card" id="scCard">
    <div class="sc-icon">🔒</div>
    <div class="sc-title">Access Results</div>
    <div class="sc-sub">Enter the access code to view the study results dashboard.</div>
    <input class="sc-input" id="scInput" type="text" maxlength="10"
           placeholder="Enter code" autocomplete="off"
           onkeydown="if(event.key==='Enter')scSubmit()">
    <div class="sc-err" id="scErr"></div>
    <button class="sc-btn" onclick="scSubmit()">Access Results &rarr;</button>
    <a class="sc-cancel" onclick="scClose()">Cancel</a>
  </div>
</div>
<script>
// ── SECRET CODE GATE ──
function scOpen(){
  document.getElementById('scOverlay').classList.add('open');
  document.getElementById('scInput').value='';
  document.getElementById('scErr').textContent='';
  document.getElementById('scInput').classList.remove('err');
  setTimeout(()=>document.getElementById('scInput').focus(),80);
}
function scClose(e){
  if(e && e.target!==document.getElementById('scOverlay')) return;
  document.getElementById('scOverlay').classList.remove('open');
}
function scSubmit(){
  const val = document.getElementById('scInput').value.trim().toUpperCase();
  if(val === 'SC4L3X9'){
    window.location.href='results.html';
  } else {
    const card = document.getElementById('scCard');
    const inp  = document.getElementById('scInput');
    const err  = document.getElementById('scErr');
    inp.classList.add('err');
    err.textContent = 'Incorrect code. Please try again.';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    inp.select();
  }
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') document.getElementById('scOverlay').classList.remove('open');
});
</script>
</body>
</html>
