<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Survey | Neophilia–Neophobia Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0e1c2f;--navy:#1a3a5c;--blue:#1e5fa8;
  --teal:#0d8a7a;--gold:#c8922a;--cream:#f5f0e8;
  --off:#faf8f5;--muted:#6b7c8d;--light:#e8eff7;
  --border:#d0dce8;--white:#ffffff;--err:#c0392b;
  --green:#1e8449;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--ink);min-height:100vh}

/* ── HEADER ── */
.survey-header{
  position:sticky;top:0;z-index:100;
  background:rgba(14,28,47,0.96);backdrop-filter:blur(12px);
  padding:0.9rem 2.5rem;
  display:flex;align-items:center;gap:1.5rem;
}
.header-brand{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;color:#fff;white-space:nowrap;flex-shrink:0;
}
.header-brand span{color:var(--gold)}
.progress-wrap{flex:1;display:flex;flex-direction:column;gap:0.3rem}
.progress-labels{display:flex;justify-content:space-between;font-size:0.7rem;color:rgba(255,255,255,0.45)}
.progress-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:width 0.4s ease}
.header-counter{
  font-size:0.75rem;color:rgba(255,255,255,0.5);white-space:nowrap;flex-shrink:0
}

/* ── LAYOUT ── */
.survey-body{max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 5rem}

/* ── SECTION CARD ── */
.section-card{
  background:#fff;border:1px solid var(--border);
  border-radius:1rem;padding:2.5rem;
  margin-bottom:1.5rem;
  animation:fadeUp 0.4s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.section-tag{
  font-size:0.68rem;font-weight:500;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--teal);margin-bottom:0.6rem;display:block
}
.section-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.8rem;font-weight:300;color:var(--ink);margin-bottom:0.3rem
}
.section-subtitle{font-size:0.88rem;color:var(--muted);line-height:1.6;margin-bottom:1.8rem}

/* ── FORM FIELDS ── */
.field{margin-bottom:1.4rem}
label.field-label{
  display:block;font-size:0.82rem;font-weight:500;
  color:var(--navy);margin-bottom:0.45rem
}
label.field-label .req{color:var(--err);margin-left:2px}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:0.65rem 0.9rem;
  border:1.5px solid var(--border);border-radius:0.45rem;
  font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--ink);
  background:#fff;outline:none;transition:border-color 0.2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
input.err,select.err,textarea.err{border-color:var(--err)}
.field-error{font-size:0.75rem;color:var(--err);margin-top:0.3rem;display:none}
.field-error.show{display:block}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
@media(max-width:600px){.two-col,.three-col{grid-template-columns:1fr}}

/* ── LIKERT ── */
.likert-wrap{display:flex;gap:0.5rem;flex-wrap:wrap}
.likert-opt{flex:1;min-width:3rem}
.likert-opt input{display:none}
.likert-opt label{
  display:flex;flex-direction:column;align-items:center;gap:0.3rem;
  padding:0.6rem 0.4rem;border:1.5px solid var(--border);
  border-radius:0.5rem;cursor:pointer;font-size:0.75rem;
  color:var(--muted);text-align:center;line-height:1.3;
  transition:all 0.15s;
}
.likert-opt input:checked + label{
  border-color:var(--teal);background:rgba(13,138,122,0.07);
  color:var(--teal);font-weight:500
}
.likert-opt label:hover{border-color:var(--navy);color:var(--navy)}
.likert-num{font-size:1.1rem;font-weight:600;color:inherit}

/* ── RADIO PILLS ── */
.radio-group{display:flex;flex-direction:column;gap:0.5rem}
.radio-opt input{display:none}
.radio-opt label{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.7rem 1rem;border:1.5px solid var(--border);
  border-radius:0.45rem;cursor:pointer;font-size:0.88rem;color:var(--muted);
  transition:all 0.15s
}
.radio-opt input:checked + label{
  border-color:var(--teal);background:rgba(13,138,122,0.06);
  color:var(--ink);font-weight:500
}
.radio-dot{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;transition:all 0.15s
}
.radio-opt input:checked + label .radio-dot{
  border-color:var(--teal);background:var(--teal)
}

/* ── CHECKBOX PILLS ── */
.check-group{display:flex;flex-direction:column;gap:0.45rem}
.check-opt input{display:none}
.check-opt label{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.6rem 1rem;border:1.5px solid var(--border);
  border-radius:0.45rem;cursor:pointer;font-size:0.85rem;color:var(--muted);
  transition:all 0.15s
}
.check-opt input:checked + label{
  border-color:var(--blue);background:rgba(30,95,168,0.05);
  color:var(--ink);font-weight:500
}
.check-box{
  width:14px;height:14px;border-radius:3px;border:2px solid var(--border);
  flex-shrink:0;transition:all 0.15s;display:flex;align-items:center;justify-content:center
}
.check-opt input:checked + label .check-box{
  border-color:var(--blue);background:var(--blue)
}
.check-opt input:checked + label .check-box::after{
  content:'✓';color:#fff;font-size:9px;font-weight:700
}

/* ── SLIDER ── */
.slider-wrap{padding:0.5rem 0}
.slider-labels{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);margin-bottom:0.4rem}
input[type=range]{
  width:100%;-webkit-appearance:none;height:6px;
  background:linear-gradient(to right,var(--teal) 0%,var(--teal) var(--pct,50%),var(--border) var(--pct,50%),var(--border) 100%);
  border-radius:3px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:2px solid var(--teal);box-shadow:0 2px 6px rgba(0,0,0,0.15);cursor:pointer
}
.slider-value{
  text-align:center;margin-top:0.5rem;
  font-family:'Cormorant Garamond',serif;
  font-size:1.8rem;font-weight:600;color:var(--teal)
}

/* ── PRODUCT IMAGE CARDS ── */
.product-block{
  background:var(--off);border:1px solid var(--border);
  border-radius:1rem;padding:2rem;margin-bottom:2rem
}
.product-block-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.5rem
}
.product-block-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.4rem;font-weight:600;color:var(--navy)
}
.product-block-count{
  font-size:0.72rem;color:var(--muted);letter-spacing:0.06em;
  text-transform:uppercase
}
.product-block-note{font-size:0.82rem;color:var(--muted);margin-bottom:1.2rem;line-height:1.5}

.image-choice-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem
}
@media(max-width:600px){.image-choice-grid{grid-template-columns:1fr}}

.img-card{
  border:2.5px solid var(--border);border-radius:0.75rem;
  overflow:hidden;cursor:pointer;
  transition:border-color 0.2s,box-shadow 0.2s,transform 0.15s;
  background:#fff;
}
.img-card:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.img-card.selected{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,138,122,0.15)}
.img-card.ranked-1{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,146,42,0.15)}
.img-card.ranked-2{border-color:var(--blue);box-shadow:0 0 0 2px rgba(30,95,168,0.1)}
.img-card.ranked-3{border-color:var(--muted);box-shadow:0 0 0 2px rgba(107,124,141,0.1)}

.img-placeholder{
  width:100%;aspect-ratio:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--light) 0%,#fff 100%);
  font-size:3.5rem;position:relative;
}
.img-placeholder-label{
  font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);margin-top:0.5rem
}
.img-card-footer{
  padding:0.7rem 1rem;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between
}
.img-card-letter{
  font-family:'Cormorant Garamond',serif;
  font-size:1.2rem;font-weight:600;color:var(--navy)
}
.img-card-rank{
  font-size:0.7rem;font-weight:500;color:var(--muted);
  background:var(--light);padding:0.2rem 0.5rem;border-radius:0.25rem
}
.img-card.selected .img-card-rank{background:rgba(13,138,122,0.1);color:var(--teal)}

/* ── RANK INSTRUCTION ── */
.rank-instruction{
  font-size:0.8rem;color:var(--muted);margin-bottom:0.8rem;
  padding:0.6rem 1rem;background:var(--light);border-radius:0.45rem;
  display:flex;align-items:center;gap:0.5rem
}

/* ── QUESTION BLOCK ── */
.q-block{margin-bottom:1.6rem}
.q-label{
  font-size:0.88rem;font-weight:500;color:var(--ink);
  margin-bottom:0.7rem;line-height:1.5
}
.q-label .qnum{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;color:var(--teal);margin-right:0.4rem;font-weight:600
}

/* ── BRANCHING ── */
.branch-reveal{display:none;margin-top:0.8rem;padding:1rem;background:var(--light);border-radius:0.5rem}
.branch-reveal.show{display:block}

/* ── NAV BUTTONS ── */
.nav-buttons{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:2rem;gap:1rem;flex-wrap:wrap
}
.btn-back{
  padding:0.8rem 1.8rem;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);
  border-radius:0.5rem;font-family:'DM Sans',sans-serif;
  font-size:0.88rem;cursor:pointer;transition:all 0.2s
}
.btn-back:hover{border-color:var(--navy);color:var(--navy)}
.btn-next{
  padding:0.8rem 2rem;background:var(--navy);color:#fff;
  border:none;border-radius:0.5rem;font-family:'DM Sans',sans-serif;
  font-size:0.88rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:0.6rem;
  transition:background 0.2s,transform 0.15s
}
.btn-next:hover{background:var(--blue);transform:translateY(-1px)}
.btn-submit{background:var(--teal)}
.btn-submit:hover{background:#0a7a6c}

/* ── TRAIT SCALE ── */
.trait-row{
  display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start;
  padding:1rem 0;border-bottom:1px solid var(--border)
}
.trait-row:last-child{border-bottom:none}
.trait-statement{font-size:0.88rem;color:var(--ink);line-height:1.5}
.trait-scale{display:flex;gap:0.3rem}
.trait-btn{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);
  background:transparent;cursor:pointer;font-size:0.75rem;color:var(--muted);
  transition:all 0.15s;display:flex;align-items:center;justify-content:center
}
.trait-btn:hover{border-color:var(--navy);color:var(--navy)}
.trait-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}

/* ── SAVED NOTICE ── */
.saved-notice{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--ink);color:#fff;padding:0.6rem 1.2rem;
  border-radius:2rem;font-size:0.78rem;
  opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:200
}
.saved-notice.show{opacity:1}

/* ── SECTION DIVIDER ── */
.section-divider{
  display:flex;align-items:center;gap:1rem;margin:2.5rem 0 1.5rem;
  font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)
}
.section-divider::before,.section-divider::after{
  content:'';flex:1;height:1px;background:var(--border)
}

/* ── CHAR COUNT ── */
.char-count{font-size:0.72rem;color:var(--muted);text-align:right;margin-top:0.3rem}

/* ── HIDDEN ── */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- HEADER -->
<header class="survey-header">
  <div class="header-brand">N<span>&</span>N Study</div>
  <div class="progress-wrap">
    <div class="progress-labels">
      <span id="sectionLabel">Demographics</span>
      <span id="sectionOf">Section 1 of 9</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:11%"></div></div>
  </div>
  <div class="header-counter" id="timeEst">~27 min remaining</div>
</header>

<main class="survey-body" id="surveyBody"></main>

<div class="saved-notice" id="savedNotice">✓ Progress saved</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════════
const PRODUCTS = [
  { id:'cup',       label:'Cup / Mug',       icon:'☕', icons:['☕','🍵','🫙'] },
  { id:'watch',     label:'Wrist Watch',      icon:'⌚', icons:['⌚','🕐','⏱'] },
  { id:'perfume',   label:'Perfume Bottle',   icon:'🧴', icons:['🧴','💊','🫧'] },
  { id:'clock',     label:'Desk Clock',       icon:'🕐', icons:['🕐','⏰','⏲'] },
  { id:'lamp',      label:'Table Lamp',       icon:'💡', icons:['💡','🪔','🔦'] },
  { id:'bottle',    label:'Water Bottle',     icon:'🫗', icons:['🫗','🧃','🫙'] },
];

const ARCHETYPES = ['Conventional','Hybrid','Unconventional'];

const MOTIVATION_OPTIONS = [
  'Familiar / comfortable','Aesthetically bold',
  'Unique / stands out','Practical / functional-looking',
  'Trendy / modern','Classic / timeless','Other'
];

const CONTEXT_OPTIONS = [
  'Personal use','Gift for someone',
  'Professional / work setting','Social display / to impress'
];

const TRAIT_STATEMENTS = [
  {id:'G1', text:'I enjoy trying products that have an unusual or unexpected design.'},
  {id:'G2', text:'I prefer products that look similar to what I already own.'},
  {id:'G3', text:'A bold product design makes me more interested in buying it.'},
  {id:'G4', text:'I find very unconventional designs difficult to trust or understand.'},
  {id:'G5', text:'I like to own products that express my personal identity through design.'},
  {id:'G6', text:'When buying everyday items, I prefer designs that look "normal" or standard.'},
  {id:'G7', text:'I am often one of the first among my peers to adopt a new design trend.'},
  {id:'G8', text:'Seeing a product I do not recognise makes me hesitant to purchase it.'},
];

const SECTIONS = [
  'Demographics',
  'Cup / Mug',
  'Wrist Watch',
  'Perfume Bottle',
  'Desk Clock',
  'Table Lamp',
  'Water Bottle',
  'Design Personality',
  'Final Questions',
];

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
let current = 0;
let responses = JSON.parse(localStorage.getItem('nn_survey') || '{}');
// Randomise archetype order per product (seeded to session)
const ORDER_KEY = 'nn_order';
let productOrders = JSON.parse(sessionStorage.getItem(ORDER_KEY) || 'null');
if (!productOrders) {
  productOrders = {};
  PRODUCTS.forEach(p => {
    const arr = [0,1,2];
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    productOrders[p.id] = arr;
  });
  sessionStorage.setItem(ORDER_KEY, JSON.stringify(productOrders));
}

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,7); }

function save(){
  localStorage.setItem('nn_survey', JSON.stringify(responses));
  const n = document.getElementById('savedNotice');
  n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'), 1800);
}

function updateHeader(){
  const pct = Math.round(((current+1)/SECTIONS.length)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('sectionLabel').textContent = SECTIONS[current];
  document.getElementById('sectionOf').textContent = `Section ${current+1} of ${SECTIONS.length}`;
  const mins = Math.max(1, Math.round(27*(1-(current/SECTIONS.length))));
  document.getElementById('timeEst').textContent = `~${mins} min remaining`;
}

function render(){
  updateHeader();
  const body = document.getElementById('surveyBody');
  body.innerHTML = '';
  body.scrollIntoView({behavior:'smooth', block:'start'});

  if(current === 0)           renderDemographics(body);
  else if(current >= 1 && current <= 6) renderProductBlock(body, PRODUCTS[current-1]);
  else if(current === 7)      renderTraits(body);
  else if(current === 8)      renderClosing(body);
}

// ═══════════════════════════════════════════════════════════════════════
// SECTION 1 — DEMOGRAPHICS
// ═══════════════════════════════════════════════════════════════════════
function renderDemographics(body){
  const d = responses.demographics || {};
  body.innerHTML = `
  <div class="section-card">
    <span class="section-tag">Section 1 of 9</span>
    <h2 class="section-title">Tell us about yourself</h2>
    <p class="section-subtitle">Your details help us group responses by generation, gender, and background. All information is anonymised before analysis.</p>

    <div class="field">
      <label class="field-label" for="p1">Full Name <span style="font-size:0.75rem;color:var(--muted);font-weight:400">(optional — leave blank to stay anonymous)</span></label>
      <input type="text" id="p1" placeholder="Your name or leave blank" value="${d.name||''}">
    </div>

    <div class="two-col">
      <div class="field">
        <label class="field-label" for="p2">Date of Birth <span class="req">*</span></label>
        <input type="date" id="p2" value="${d.dob||''}" max="${new Date().toISOString().split('T')[0]}">
        <div class="field-error" id="p2err">Please enter your date of birth.</div>
      </div>
      <div class="field">
        <label class="field-label" for="p3">Gender <span class="req">*</span></label>
        <select id="p3">
          <option value="">Select…</option>
          ${['Male','Female','Non-binary','Prefer not to say','Other'].map(g=>`<option value="${g}" ${d.gender===g?'selected':''}>${g}</option>`).join('')}
        </select>
        <div class="field-error" id="p3err">Please select your gender.</div>
      </div>
    </div>

    <div class="two-col">
      <div class="field">
        <label class="field-label" for="p4">Occupation <span class="req">*</span></label>
        <select id="p4">
          <option value="">Select…</option>
          ${['Student','Employed – creative field','Employed – technical field','Employed – business/management','Self-employed','Homemaker','Retired','Unemployed','Other'].map(o=>`<option value="${o}" ${d.occupation===o?'selected':''}>${o}</option>`).join('')}
        </select>
        <div class="field-error" id="p4err">Please select your occupation.</div>
      </div>
      <div class="field">
        <label class="field-label" for="p5">Educational Background <span class="req">*</span></label>
        <select id="p5">
          <option value="">Select…</option>
          ${['No formal education','Secondary school','Undergraduate degree','Postgraduate degree','Doctoral degree','Vocational / trade qualification'].map(e=>`<option value="${e}" ${d.education===e?'selected':''}>${e}</option>`).join('')}
        </select>
        <div class="field-error" id="p5err">Please select your education level.</div>
      </div>
    </div>

    <div class="two-col">
      <div class="field">
        <label class="field-label" for="p6c">City <span class="req">*</span></label>
        <input type="text" id="p6c" placeholder="Your city" value="${d.city||''}">
        <div class="field-error" id="p6cerr">Please enter your city.</div>
      </div>
      <div class="field">
        <label class="field-label" for="p6n">Country <span class="req">*</span></label>
        <input type="text" id="p6n" placeholder="Your country" value="${d.country||''}">
        <div class="field-error" id="p6nerr">Please enter your country.</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="p7">Monthly Income Range <span class="req">*</span></label>
      <select id="p7">
        <option value="">Select…</option>
        ${['Below $500','$500–$1,000','$1,001–$2,500','$2,501–$5,000','$5,001–$10,000','Above $10,000','Prefer not to say'].map(i=>`<option value="${i}" ${d.income===i?'selected':''}>${i}</option>`).join('')}
      </select>
      <div class="field-error" id="p7err">Please select your income range.</div>
    </div>

    <div class="field">
      <label class="field-label">How would you rate your awareness of product design trends? <span class="req">*</span></label>
      <div class="likert-wrap" id="p8wrap">

function saveDemographics(){
  let valid = true;
  const fields = [
    {id:'p2', errId:'p2err', check:v=>v},
    {id:'p3', errId:'p3err', check:v=>v},
    {id:'p4', errId:'p4err', check:v=>v},
    {id:'p5', errId:'p5err', check:v=>v},
    {id:'p6c',errId:'p6cerr',check:v=>v.trim()},
    {id:'p6n',errId:'p6nerr',check:v=>v.trim()},
    {id:'p7', errId:'p7err', check:v=>v},
  ];
  fields.forEach(f=>{
    const el=document.getElementById(f.id);
    const ok=f.check(el.value);
    el.classList.toggle('err',!ok);
    document.getElementById(f.errId).classList.toggle('show',!ok);
    if(!ok)valid=false;
  });
  const p8 = document.querySelector('input[name="p8"]:checked');
  document.getElementById('p8err').classList.toggle('show',!p8);
  if(!p8)valid=false;

  if(!valid){document.querySelector('.err')?.scrollIntoView({behavior:'smooth',block:'center'});return;}

  // Compute generation
  const dob = new Date(document.getElementById('p2').value);
  const year = dob.getFullYear();
  let gen = year<=1980?'Gen X':year<=1996?'Gen Y (Millennials)':year<=2012?'Gen Z':'Gen Alpha';

  responses.demographics = {
    name: document.getElementById('p1').value,
    dob: document.getElementById('p2').value,
    birth_year: year, generation: gen,
    gender: document.getElementById('p3').value,
    occupation: document.getElementById('p4').value,
    education: document.getElementById('p5').value,
    city: document.getElementById('p6c').value,
    country: document.getElementById('p6n').value,
    income: document.getElementById('p7').value,
    design_awareness: p8.value,
  };
  save(); current=1; render();
}

            <input type="radio" name="${pid}_like_${letter}" id="${pid}_like_${letter}_${n}" value="${n}"

          <div class="check-opt">

      </div>
      <div class="field-error" id="${pid}_q6err">Please select at least one reason.</div>

    <!-- NEOPHOBIA THRESHOLD Q7 -->

        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </button>
    </div>
  </div>`;

  // Restore rank display
  if(pr.q2_ranking){
    pr.q2_ranking.forEach((letter,i)=>{
      const card = document.getElementById(`${pid}_card_${letter}`);
      if(card){
        if(i===0)card.classList.add('selected');
        else if(i===1)card.classList.add('ranked-2');
        else card.classList.add('ranked-3');
        document.getElementById(`${pid}_rank_${letter}`).textContent = `#${i+1}`;
      }
    });
    updateRankDisplay(pid, pr.q2_ranking);
  }
}

function selectImage(pid, letter, archIdx){
  if(!responses[pid]) responses[pid]={};
  const pr = responses[pid];

  // Remove previous first choice highlight
  ['A','B','C'].forEach(l=>{
    const c = document.getElementById(`${pid}_card_${l}`);
    if(c) c.classList.remove('selected');
  });

  pr.q1_letter = letter;
  pr.q1_archetype = ARCHETYPES[archIdx];
  const card = document.getElementById(`${pid}_card_${letter}`);
  card.classList.add('selected');
  document.getElementById(`${pid}_rank_${letter}`).textContent = '#1 ✓';

  // Auto start ranking
  if(!pr.q2_ranking) pr.q2_ranking = [];
  const idx = pr.q2_ranking.indexOf(letter);
  if(idx===-1) pr.q2_ranking.unshift(letter);
  else { pr.q2_ranking.splice(idx,1); pr.q2_ranking.unshift(letter); }
  // Prompt for remaining
  promptRemainingRanks(pid, letter);
  document.getElementById(`${pid}_q1err`).classList.remove('show');
}

function promptRemainingRanks(pid, firstLetter){
  const pr = responses[pid];
  const others = ['A','B','C'].filter(l=>l!==firstLetter);
  // Reset others
  others.forEach(l=>{
    const c = document.getElementById(`${pid}_card_${l}`);
    if(c){c.classList.remove('ranked-2','ranked-3','selected');}
    const r = document.getElementById(`${pid}_rank_${l}`);
    if(r) r.textContent = 'Click to rank';
    // Add click handlers for 2nd/3rd
    if(c) c.onclick = ()=>rankSecondary(pid,l,others);
  });
}

function rankSecondary(pid, letter, allOthers){
  const pr = responses[pid];
  if(!pr.q2_ranking) pr.q2_ranking=[];
  const existing = pr.q2_ranking.filter(l=>l!==letter);
  pr.q2_ranking = existing;
  // Find slot
  const firstL = pr.q1_letter;
  const ranked = pr.q2_ranking.filter(l=>l!==firstL);
  ranked.push(letter);
  const remaining = allOthers.filter(l=>!ranked.includes(l));
  pr.q2_ranking = [firstL,...ranked,...remaining];
  // Re-draw
  allOthers.forEach(l=>{
    const idx = pr.q2_ranking.indexOf(l);
    const c = document.getElementById(`${pid}_card_${l}`);
    const r = document.getElementById(`${pid}_rank_${l}`);
    if(!c) return;
    c.classList.remove('ranked-2','ranked-3');
    if(idx===1){c.classList.add('ranked-2'); if(r) r.textContent='#2';}
    else if(idx===2){c.classList.add('ranked-3'); if(r) r.textContent='#3';}
  });
  updateRankDisplay(pid, pr.q2_ranking);
}

function updateRankDisplay(pid, ranking){
  const el = document.getElementById(`${pid}_rankDisplay`);
  if(el && ranking) el.textContent = ranking.map((l,i)=>`${i+1}. Option ${l}`).join('  ›  ');
}

function updateSlider(pid, val){
  if(!responses[pid]) responses[pid]={};
  responses[pid].q7_threshold = parseInt(val);
  document.getElementById(`${pid}_sliderVal`).textContent = val;
  const pct = ((val-1)/9)*100;
  document.getElementById(`${pid}_slider`).style.setProperty('--pct', pct+'%');
}

function toggleMotivation(pid, val){
  if(!responses[pid]) responses[pid]={};
  let arr = responses[pid].q6_motivation || [];
  const idx = arr.indexOf(val);
  if(idx===-1){
    if(arr.length>=2){
      // Uncheck oldest
      const old = arr.shift();
      const cbs = document.querySelectorAll(`#${pid}_motiveGroup input`);
      cbs.forEach(cb=>{if(cb.value===old)cb.checked=false;});
    }
    arr.push(val);
  } else { arr.splice(idx,1); }
  responses[pid].q6_motivation = arr;
}

function handleContextChange(pid, val){
  if(!responses[pid]) responses[pid]={};
  responses[pid].q8_context = val;
  const branch = document.getElementById(`${pid}_ctxBranch`);
  if(val==='context_dependent') branch.classList.add('show');
  else { branch.classList.remove('show'); responses[pid].q8_contexts=[]; }
}

function toggleContext(pid, val){
  if(!responses[pid]) responses[pid]={};
  let arr = responses[pid].q8_contexts || [];
  const idx = arr.indexOf(val);
  if(idx===-1) arr.push(val); else arr.splice(idx,1);
  responses[pid].q8_contexts = arr;
}

function saveField(pid, field, val){
  if(!responses[pid]) responses[pid]={};
  responses[pid][field] = val;
}

function saveProductBlock(pid){
  const pr = responses[pid] || {};
  let valid = true;

  if(!pr.q1_letter){
    document.getElementById(`${pid}_q1err`).classList.add('show'); valid=false;
  }
  if(!pr.q2_ranking || pr.q2_ranking.length<3){
    document.getElementById(`${pid}_q2err`).classList.add('show'); valid=false;
  }
  // Check likelihoods
  ['A','B','C'].forEach(l=>{
    const radio = document.querySelector(`input[name="${pid}_like_${l}"]:checked`);
    const errEl = document.getElementById(`${pid}_like_${l}_err`);
    if(!radio){ if(errEl) errEl.classList.add('show'); valid=false; }
    else { if(errEl) errEl.classList.remove('show'); if(!pr[`like_${l}`]) pr[`like_${l}`]=parseInt(radio.value); }
  });
  if(!pr.q6_motivation || pr.q6_motivation.length===0){
    document.getElementById(`${pid}_q6err`).classList.add('show'); valid=false;
  }
  if(!pr.q8_context){
    document.getElementById(`${pid}_q8err`).classList.add('show'); valid=false;
  }

  if(!valid){ document.querySelector('.field-error.show')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(!pr.q7_threshold) pr.q7_threshold = parseInt(document.getElementById(`${pid}_slider`).value);
  responses[pid] = pr;
  save(); current++; render();
}

function selectTrait(id, val){

function saveTraits(){

function saveClosing(field, val){
  if(!responses.closing) responses.closing={};
  responses.closing[field] = val;
}

function updateCharCount(el, countId){
  document.getElementById(countId).textContent = el.value.length+'/500';
}

function submitSurvey(){
  const cl = responses.closing || {};
  let valid = true;
  ['c1','c2','c3','c4'].forEach(f=>{
    const ok = !!cl[f];
    document.getElementById(`${f}err`).classList.toggle('show',!ok);
    if(!ok) valid=false;
  });
  if(!valid){ document.querySelector('.field-error.show')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }

  responses.closing.c5 = document.getElementById('c5input')?.value || '';
  responses.submitted_at = new Date().toISOString();

  // Submit to Web3Forms (replace ACCESS_KEY with real key)
  const payload = {
    access_key: 'ee7f8623-c2f9-46cc-9f21-9e7e86c63748',
    subject: 'N&N Study Response — '+new Date().toLocaleDateString(),
    from_name: 'Neophilia-Neophobia Survey',
    message: JSON.stringify(responses, null, 2),
  };

  fetch('https://api.web3forms.com/submit', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  })
  .then(r=>r.json())
  .then(data=>{
    localStorage.removeItem('nn_survey');
    window.location.href = 'thank-you.html';
  })
  .catch(()=>{
    // Still redirect — responses are in localStorage as backup
    localStorage.setItem('nn_survey_submitted', JSON.stringify(responses));
    window.location.href = 'thank-you.html';
  });
}

function goBack(){
  if(current>0){ current--; render(); }
}

// ── INIT ──
render();
</script>
